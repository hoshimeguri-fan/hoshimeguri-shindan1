<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星めぐり学園 推しライバー診断</title>
  <style>
    :root {
      --bg-dark: #0f1123;
      --card-bg: #1a1d36;
      --accent: #7986cb;
      --accent-hover: #9fa8da;
      --star-color: #ffd54f;
      --text-main: #e0e0e0;
      --text-sub: #9e9e9e;
      --official-color: #4fc3f7;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(121, 134, 203, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 213, 79, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 640px;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 16px;
    }

    .site-logo {
      max-width: 220px;
      height: auto;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--star-color);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .progress-bar-container {
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-bar {
      background: linear-gradient(90deg, var(--accent), var(--star-color));
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .q-number {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 12px 0 24px 0;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-2px);
    }

    .back-btn-wrapper {
      margin-top: 18px;
      display: flex;
      justify-content: flex-start;
    }

    .back-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .back-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
      background: rgba(121, 134, 203, 0.1);
    }

    /* Result Section */
    .result-container {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-badge {
      display: inline-block;
      background: rgba(255, 213, 79, 0.15);
      color: var(--star-color);
      border: 1px solid var(--star-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .result-name {
      font-size: 2.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #fff;
    }

    .counter-badge {
      display: inline-block;
      background: rgba(121, 134, 203, 0.2);
      border: 1px solid var(--accent);
      color: #e0e0e0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .counter-num {
      color: var(--star-color);
      font-weight: bold;
      font-size: 1.05rem;
    }

    .image-wrapper {
      width: 100%;
      max-width: 400px;
      height: 460px;
      margin: 0 auto 24px auto;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
      box-sizing: border-box;
    }

    .liver-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    }

    .result-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cfd8dc;
      text-align: left;
      background: rgba(0, 0, 0, 0.25);
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 24px;
      white-space: pre-line;
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post-action-button {
      background: #ffffff !important;
      color: #000000 !important;
      border: none !important;
      padding: 15px !important;
      border-radius: 10px !important;
      text-decoration: none !important;
      font-weight: bold !important;
      font-size: 1rem !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15) !important;
      transition: 0.2s ease !important;
      cursor: pointer !important;
      visibility: visible !important;
      opacity: 1 !important;
    }

    .post-action-button:hover {
      background: #e6e6e6 !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.25) !important;
    }

    .official-profile-link {
      background: rgba(79, 195, 247, 0.12);
      color: var(--official-color);
      border: 1px solid var(--official-color);
      padding: 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .official-profile-link:hover {
      background: var(--official-color);
      color: #0f1123;
    }

    .retry-btn {
      background: transparent;
      border: 1px solid var(--text-sub);
      color: var(--text-sub);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .retry-btn:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 16px;
      }
      .site-logo {
        max-width: 180px;
      }
      .image-wrapper {
        max-width: 100%;
        height: 380px;
      }
    }
  </style>
</head>

<div class="container">
  <div id="quiz-box">
    <div class="logo-container">

    </div>

      </a>

    </div>
  </div>
</div>

let currentQ = 0;
let userScores = {};
let scoreHistory = [];

function initScores() {
  userScores = {};
  scoreHistory = [];
  for (let liver in LIVERS) {
    userScores[liver] = 0;
  }
}

function renderQuestion() {
  const qData = questions[currentQ];
  document.getElementById("q-number").innerText = `QUESTION ${String(currentQ + 1).padStart(2, '0')} / ${questions.length}`;
  document.getElementById("q-text").innerText = qData.q;
  
  const progressPercent = ((currentQ) / questions.length) * 100;
  document.getElementById("progress").style.width = `${progressPercent}%`;

  const backBtn = document.getElementById("back-btn");
  if (currentQ > 0) {
    backBtn.style.display = "inline-flex";
  } else {
    backBtn.style.display = "none";
  }

  const optContainer = document.getElementById("options-container");
  optContainer.innerHTML = "";

  qData.opts.forEach((opt) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = opt.text;
    btn.onclick = () => selectOption(opt.scores);
    optContainer.appendChild(btn);
  });
}

function selectOption(scores) {
  scoreHistory.push(scores);

  for (let liver in scores) {
    if (userScores.hasOwnProperty(liver)) {
      userScores[liver] += scores[liver];
    }
  }

  currentQ++;
  if (currentQ < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQ > 0) {
    const lastScores = scoreHistory.pop();
    if (lastScores) {
      for (let liver in lastScores) {
        if (userScores.hasOwnProperty(liver)) {
          userScores[liver] -= lastScores[liver];
        }
      }
    }
    currentQ--;
    renderQuestion();
  }
}

async function fetchLiverCount(liverKey) {
  try {
    const res = await fetch(`https://api.counterapi.dev/v1/hoshimeguri_shindan_app/${liverKey}/up`);
    if (res.ok) {
      const data = await res.json();
      return data.count;
    }
  } catch (e) {
    console.warn("Counter API offline, using local fallback");
  }
  let localCount = parseInt(localStorage.getItem(`count_${liverKey}`) || "0", 10) + 1;
  localStorage.setItem(`count_${liverKey}`, localCount);
  return localCount;
}

async function showResult() {
  document.getElementById("progress").style.width = `100%`;
  document.getElementById("quiz-box").style.display = "none";
  
  let bestLiver = "";
  let maxScore = -1;
  for (let liver in userScores) {
    if (userScores[liver] > maxScore) {
      maxScore = userScores[liver];
      bestLiver = liver;
    }
  }

  const liverInfo = LIVERS[bestLiver];
  document.getElementById("liver-name").innerText = bestLiver;
  document.getElementById("counter-liver-name").innerText = bestLiver;
  document.getElementById("liver-desc").innerText = liverInfo.desc;

  const officialBtn = document.getElementById("official-btn");
  officialBtn.href = liverInfo.url || "https://hoshimeguri.live/";

  const imgElement = document.getElementById("liver-img");
  const imgContainer = document.getElementById("image-container");
  if (liverInfo.img && liverInfo.img.trim() !== "") {
    imgElement.src = liverInfo.img;
    imgContainer.style.display = "flex";
  } else {
    imgContainer.style.display = "none";
  }

  // ライバーごとのOGP専用ページURLを生成
  const baseUrl = window.location.href.split('?')[0].replace(/index\.html$/, '').replace(/\/$/, '');
  const shareTargetUrl = `${baseUrl}/${liverInfo.file}`;

  const shareText = encodeURIComponent(
    `【星めぐり学園 推し診断】\n私にぴったりなライバーは…✨「${bestLiver}」✨でした！\n\n#星めぐり学園推し診断\n`
  );
  const shareUrl = encodeURIComponent(shareTargetUrl);
  const postBtn = document.getElementById("result-post-link");
  postBtn.href = `https://x.com/intent/post?text=${shareText}&url=${shareUrl}`;
  postBtn.style.display = "flex";

  document.getElementById("result-box").style.display = "block";

  const count = await fetchLiverCount(liverInfo.key);
  document.getElementById("liver-count").innerText = count.toLocaleString();
}

function restartQuiz() {
  currentQ = 0;
  initScores();
  document.getElementById("result-box").style.display = "none";
  document.getElementById("quiz-box").style.display = "block";
  renderQuestion();
}

initScores();
renderQuestion();
